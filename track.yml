name: Track jets

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may delay runs a few minutes)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track-jets
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Snapshot ADS-B data
        run: python scripts/track_jets.py
      - name: Commit data
        run: |
          git config user.name "jet-bot"
          git config user.email "jet-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "Jet snapshot $(TZ=America/Chicago date '+%F %H:%M')"
          git pull --rebase
          git push
